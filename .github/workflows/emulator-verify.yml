name: Emulator End-to-End Verification

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/verify_on_emulator.sh"
      - ".github/workflows/emulator-verify.yml"

permissions:
  contents: read

jobs:
  emulator-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Make verification script executable
        run: chmod +x scripts/verify_on_emulator.sh

      - name: Boot Pixel Pro Android 15 (API 35) Emulator & Run E2E Gesture Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify_on_emulator.sh

      - name: Upload Emulator Screenshots & Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-verification-results
          path: emulator-verification/**
          retention-days: 30
