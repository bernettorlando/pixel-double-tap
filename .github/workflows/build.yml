name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests & assemble APK
        run: ./gradlew test assembleRelease --no-daemon

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDoubleTap-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Attach pre-signed APK to v1.0.0 GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f releases/PixelDoubleTap-v1.0.0.apk ] && gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 releases/PixelDoubleTap-v1.0.0.apk --clobber
          fi
